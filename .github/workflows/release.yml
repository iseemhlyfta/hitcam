name: Release

# Push a tag like v0.1.0 to build all apps and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

# Only the publish job may write (create the release); the build jobs run third-party build code.
permissions:
  contents: read

jobs:
  # The tag must match the version in all three apps, or the release would ship with the old version inside.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions against the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          windows=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' windows/Directory.Build.props)
          ios=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' ios/project.yml)
          android=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "tag $want, Windows $windows, iOS $ios, Android $android"
          if [ "$windows" != "$want" ] || [ "$ios" != "$want" ] || [ "$android" != "$want" ]; then
            echo "::error::Version mismatch: tag $want, Windows $windows, iOS $ios, Android $android"
            exit 1
          fi

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  ios:
    needs: version
    uses: ./.github/workflows/ios.yml

  # Secrets carry the Android release signing key (see android.yml).
  android:
    needs: version
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [windows, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HitCam-windows-x64
          path: HitCam
      - uses: actions/download-artifact@v4
        with:
          name: HitCam-ios-unsigned-ipa
          path: ios
      - uses: actions/download-artifact@v4
        with:
          name: HitCam-android-apk
          path: android

      - name: Package
        run: |
          test -f HitCam/HitCam.exe && test -f HitCam/HitCamVCam.dll && test -f HitCam/HitCamDShow.dll && test -f HitCam/HitCamDShow32.dll
          (cd HitCam && zip -r ../HitCam-windows-x64.zip .)
          cp ios/HitCam-unsigned.ipa HitCam-ios-unsigned.ipa
          cp android/HitCam-android.apk HitCam-android.apk
          ls -la *.zip *.ipa *.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          **Windows 10 и 11:** распакуйте `HitCam-windows-x64.zip` целиком и запустите `HitCam.exe` из распакованной
          папки. При первом запуске нажмите «Установить камеру» — после этого камера **HitCam** появится в Zoom,
          Discord, Teams, OBS и браузерах. В Windows 10 её не видят приложение «Камера» и часть приложений Microsoft Store.

          **iPhone:** установите `HitCam-ios-unsigned.ipa` через Sideloadly —
          см. [docs/install-ios.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install-ios.md).

          **Android 8.0+:** скачайте `HitCam-android.apk` на телефон и установите —
          см. [docs/install-android.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install-android.md).
          EOF
          # A re-run after a failure past this point replaces the files instead of failing on the existing release.
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" HitCam-windows-x64.zip HitCam-ios-unsigned.ipa HitCam-android.apk \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" HitCam-windows-x64.zip HitCam-ios-unsigned.ipa HitCam-android.apk \
              --repo "${{ github.repository }}" --title "HitCam $TAG" --notes-file notes.md --generate-notes
          fi
