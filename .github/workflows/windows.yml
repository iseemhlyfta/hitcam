name: Windows

on:
  # Branches only: a release tag builds through release.yml, not a second time here.
  push:
    branches: ["**"]
    paths: ["windows/**", "docs/protocol.md", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "docs/protocol.md", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: |
          dotnet test HitCam.Core.Tests -c Release
          dotnet test HitCam.Desktop.Tests -c Release
      # Also builds the C++ virtual camera (HitCam.VCam) through build.ps1.
      - name: Publish desktop app
        run: dotnet publish HitCam.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../out/HitCam
      - name: Check virtual camera DLL
        shell: pwsh
        run: if (-not (Test-Path ../out/HitCam/HitCamVCam.dll)) { throw "HitCamVCam.dll is missing from the published app" }
      - uses: actions/upload-artifact@v4
        with:
          name: HitCam-windows-x64
          path: out/HitCam
