name: Windows

on:
  # Branches only: a release tag builds through release.yml, not a second time here.
  push:
    branches: ["**"]
    paths: ["windows/**", "vision/export_default.py", "vision/common.py", "vision/requirements-export.txt", "docs/protocol.md", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "vision/export_default.py", "vision/common.py", "vision/requirements-export.txt", "docs/protocol.md", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # One step per project: in a multi-line pwsh step only the last command's exit code fails the step.
      - name: Test core
        run: dotnet test HitCam.Core.Tests -c Release
      - name: Test desktop
        run: dotnet test HitCam.Desktop.Tests -c Release
      - name: Test vision
        run: dotnet test HitCam.Vision.Tests -c Release
      # Also builds the C++ virtual camera (HitCam.VCam) through build.ps1.
      - name: Publish desktop app
        run: dotnet publish HitCam.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../out/HitCam
      - name: Check virtual camera DLL
        shell: pwsh
        run: |
          foreach ($dll in "HitCamVCam.dll", "HitCamDShow.dll", "HitCamDShow32.dll") {
            if (-not (Test-Path "../out/HitCam/$dll")) { throw "$dll is missing from the published app" }
          }
      # The default object detection model (RF-DETR Nano, Apache 2.0) is exported here rather than committed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vision/requirements-export.txt
      - name: Export default vision model
        working-directory: vision
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # any failing command fails the step, not only the last
          python -m pip install --quiet torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -r requirements-export.txt
          python export_default.py --cpu --out ../out/HitCam/models
      # Hand and face models (OpenCV Zoo: MediaPipe Hands, YuNet, SFace): downloaded from a fixed commit, SHA-256 checked.
      - name: Add hand and face models
        shell: pwsh
        run: ./get-models.ps1 -Destination ../out/HitCam/models
      - name: Check vision model
        shell: pwsh
        run: |
          foreach ($file in "models/rfdetr-nano.onnx", "models/rfdetr-nano.labels.json", "models/hands/palm_detection_mediapipe_2023feb.onnx",
                            "models/hands/handpose_estimation_mediapipe_2023feb.onnx", "models/faces/face_detection_yunet_2023mar.onnx",
                            "models/faces/face_recognition_sface_2021dec.onnx", "onnxruntime.dll", "DirectML.dll") {
            if (-not (Test-Path "../out/HitCam/$file")) { throw "$file is missing from the published app" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: HitCam-windows-x64
          path: out/HitCam
