name: Windows

on:
  push:
    paths: ["windows/**", "docs/protocol.md", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "docs/protocol.md", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test HitCam.Core.Tests -c Release
      - name: Publish desktop app
        run: dotnet publish HitCam.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../out/HitCam
      - uses: actions/upload-artifact@v4
        with:
          name: HitCam-windows-x64
          path: out/HitCam
